[package]
name = "pi-recipe-check-python"
version = "0.6.0"
edition = "2021"
description = "Python bindings for the I/O-free pi-recipe-check validation engine"
license = "Apache-2.0"
repository = "https://github.com/introspection-org/pi-recipes"
homepage = "https://pi.recipes"
readme = "README.md"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pi-recipe-check = { version = "0.6.0", path = "../../crates/pi-recipe-check", default-features = false }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
serde_json = "1.0"
