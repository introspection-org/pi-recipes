[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "pi-recipe-check"
dynamic = ["version"]
description = "Python bindings for the I/O-free Pi recipe validation engine"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Introspection" }]
keywords = ["pi", "recipes", "validation", "lint", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://pi.recipes"
Repository = "https://github.com/introspection-org/pi-recipes"
Issues = "https://github.com/introspection-org/pi-recipes/issues"

[tool.maturin]
bindings = "pyo3"
module-name = "pi_recipe_check._native"
python-source = "python"
strip = true
