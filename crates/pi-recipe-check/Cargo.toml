[package]
name = "pi-recipe-check"
version = "0.9.0"
edition = "2021"
description = "Pure validation library used by introspection check"
license = "Apache-2.0"
repository = "https://github.com/introspection-org/pi-recipes"
homepage = "https://pi.recipes"
readme = "README.md"
keywords = ["pi", "recipes", "validation", "lint", "agents"]
categories = ["development-tools"]

[[bin]]
name = "recipe-check"
path = "src/main.rs"

[features]
default = []
schema = ["dep:schemars"]

[dependencies]
regex = "1.11"
schemars = { version = "1.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "0.0.28"
url = "2.5"
