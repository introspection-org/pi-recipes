[package]
name = "pi-recipe-check"
version = "0.6.0"
edition = "2021"
description = "Pure validation engine for Pi recipe packages (package.json#pi, agents, judges, MCP policy, evals)"
license = "Apache-2.0"
repository = "https://github.com/introspection-org/pi-recipes"
homepage = "https://pi.recipes"
readme = "README.md"
keywords = ["pi", "recipes", "validation", "lint", "agents"]
categories = ["development-tools"]

[features]
default = ["fs", "cli"]
fs = ["dep:anyhow", "dep:walkdir"]
cli = ["fs", "dep:clap"]

[dependencies]
anyhow = { version = "1.0", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "0.0.28"
url = "2.5"
walkdir = { version = "2.5", optional = true }

[[bin]]
name = "recipe-check"
path = "src/main.rs"
required-features = ["cli"]
