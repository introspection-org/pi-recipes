[package]
name = "recipe-check"
version = "0.1.0"
edition = "2021"
description = "Pure validation engine for Recipe packages"
license = "Apache-2.0"
repository = "https://github.com/introspection-org/recipes"
homepage = "https://pi.recipes"
readme = "README.md"
keywords = ["recipes", "validation", "lint", "agents"]
categories = ["development-tools"]

[[bin]]
name = "recipe-check"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "0.0.28"
