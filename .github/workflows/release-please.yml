name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      train:
        description: Release train to recover
        type: choice
        options:
          - all
          - root
          - checker
        default: all

permissions: {}

# Push runs: newest push to a ref wins — a run superseded by a newer main
# push is cancelled rather than queued behind. workflow_dispatch runs live in
# a separate group (cancel-in-progress: false below), so a manual re-run to
# finish an interrupted release is never cancelled by a concurrent push. Safe
# either way: release-please is idempotent and the npm/crates publish
# steps skip already-published versions.
concurrency:
  group: release-please-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      root_release_created: ${{ steps.root_release.outputs.release_created }}
      crate_release_created: ${{ steps.checker_release.outputs['crates/pi-recipe-check--release_created'] }}
    steps:
      # Each train owns a different manifest. Concurrent release PRs therefore
      # never edit the same version-state file.
      - uses: googleapis/release-please-action@v5
        id: root_release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: googleapis/release-please-action@v5
        id: checker_release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-checker-config.json
          manifest-file: .release-please-checker-manifest.json

  build-native-tools:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.root_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'root'))) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            platform: linux-musl
            arch: x64
            target: x86_64-unknown-linux-musl
          - os: macos-14
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: darwin
            arch: x64
            target: x86_64-apple-darwin
          - os: windows-latest
            platform: win32
            arch: x64
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: ${{ matrix.platform == 'linux-musl' }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --target ${{ matrix.target }} -p pi-mcp-client
        if: ${{ matrix.platform != 'linux-musl' && matrix.platform != 'win32' }}

      - run: cargo build --release --target ${{ matrix.target }} -p pi-recipe-check --bin recipe-check

      - run: node scripts/package-mcp-client.mjs
        if: ${{ matrix.platform != 'linux-musl' && matrix.platform != 'win32' }}
        env:
          MCP_CLIENT_PLATFORM: ${{ matrix.platform }}
          MCP_CLIENT_ARCH: ${{ matrix.arch }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}

      - run: node scripts/package-recipe-check.mjs
        env:
          RECIPE_CHECK_PLATFORM: ${{ matrix.platform }}
          RECIPE_CHECK_ARCH: ${{ matrix.arch }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: native-tools-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            vendor/mcp-client/${{ matrix.platform }}-${{ matrix.arch }}
            vendor/recipe-check/${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    needs:
      - release-please
      - build-native-tools
    if: ${{ always() && (needs.release-please.outputs.root_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'root'))) }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck && pnpm test && pnpm build

      - uses: actions/download-artifact@v4
        with:
          pattern: native-tools-*
          path: native-tool-artifacts

      - name: Prepare packaged native binaries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/mcp-client vendor/recipe-check
          mkdir -p vendor/mcp-client vendor/recipe-check
          for artifact in native-tool-artifacts/native-tools-*; do
            platform_id="${artifact##*/native-tools-}"
            mkdir -p "vendor/mcp-client/${platform_id}"
            mkdir -p "vendor/recipe-check/${platform_id}"
            find "$artifact" -type f -name 'mcp-client*' -exec cp {} "vendor/mcp-client/${platform_id}/" \;
            find "$artifact" -type f -name 'recipe-check*' -exec cp {} "vendor/recipe-check/${platform_id}/" \;
          done
          find vendor/mcp-client -type f -name 'mcp-client*' \
            | while read -r f; do case "$f" in *.exe) ;; *) chmod 755 "$f" ;; esac; done
          find vendor/recipe-check -type f -name 'recipe-check*' \
            | while read -r f; do case "$f" in *.exe) ;; *) chmod 755 "$f" ;; esac; done
          find vendor/mcp-client -maxdepth 2 -type f -print
          find vendor/recipe-check -maxdepth 2 -type f -print

      - run: pnpm pack:check

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="latest"
          if [[ "$version" == *-* ]]; then
            tag="beta"
          fi

          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "$package_name@$version is already published"
          else
            pnpm publish --access public --tag "$tag" --no-git-checks
          fi
          npm dist-tag add "$package_name@$version" "$tag"
          if [[ "$tag" != "latest" ]]; then
            npm dist-tag rm "$package_name" latest || true
          fi
          npm access set status=public "$package_name"

  publish-crate:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.crate_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'checker'))) }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
    concurrency:
      group: crates-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test -p pi-recipe-check

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo pkgid -p pi-recipe-check | sed 's/.*[@#]//')"
          if curl -sfo /dev/null -A "pi-recipes-release (github.com/introspection-org/pi-recipes)" \
            "https://crates.io/api/v1/crates/pi-recipe-check/${version}"; then
            echo "pi-recipe-check@${version} is already published"
          else
            cargo publish -p pi-recipe-check
          fi
