name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      train:
        description: Release train to recover
        type: choice
        options:
          - all
          - root
          - checker
        default: all

permissions: {}

# Push runs: newest push to a ref wins — a run superseded by a newer main
# push is cancelled rather than queued behind. workflow_dispatch runs live in
# a separate group (cancel-in-progress: false below), so a manual re-run to
# finish an interrupted release is never cancelled by a concurrent push. Safe
# either way: release-please is idempotent and the npm/crates publish
# steps skip already-published versions.
concurrency:
  group: release-please-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      root_release_created: ${{ steps.root_release.outputs.release_created }}
      crate_release_created: ${{ steps.checker_release.outputs['crates/introspection-recipe-check--release_created'] }}
      python_release_created: ${{ steps.checker_release.outputs['bindings/python--release_created'] }}
    steps:
      # Each train owns a different manifest. Concurrent release PRs therefore
      # never edit the same version-state file.
      - uses: googleapis/release-please-action@v5
        id: root_release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: googleapis/release-please-action@v5
        id: checker_release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-checker-config.json
          manifest-file: .release-please-checker-manifest.json

      # release-please exits successfully when it finds a merged release PR
      # whose title it cannot parse. That leaves the PR untagged and blocks
      # every later checker release while the workflow still appears green.
      - name: Verify checker release state
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          stale_prs="$(
            gh api --paginate --method GET "repos/${GITHUB_REPOSITORY}/pulls" \
              -f state=closed \
              -f per_page=100 \
              --jq '.[]
                | select(.merged_at != null)
                | select(any(.labels[]; .name == "autorelease: pending-checker"))
                | "#\(.number) \(.title)"'
          )"
          if [[ -n "$stale_prs" ]]; then
            echo "Merged checker release PRs remain untagged:" >&2
            echo "$stale_prs" >&2
            exit 1
          fi

  build-native-tools:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.root_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'root'))) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
            platform_id: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            platform_id: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            platform: darwin
            arch: arm64
            platform_id: darwin-arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: darwin
            arch: x64
            platform_id: darwin-x64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }} -p pi-mcp-client

      # Staged by rust target, which is the layout build-mcp-client-packages.mjs
      # reads; the os/cpu mapping lives in npm/targets.json, not in this matrix.
      - name: Stage the binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "staged/${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/mcp-client" "staged/${{ matrix.target }}/"

      # The wildcard must sit at `staged/` so the rust-target directory survives:
      # upload-artifact roots the archive at the least common ancestor of the
      # matched files, so `staged/<target>/*` would upload a bare mcp-client and
      # the assembly step below could not tell the platforms apart.
      - uses: actions/upload-artifact@v7
        with:
          name: native-tools-${{ matrix.platform_id }}
          path: staged/**
          if-no-files-found: error

  publish:
    needs:
      - release-please
      - build-native-tools
    if: ${{ always() && (needs.release-please.outputs.root_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'root'))) }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck && pnpm test && pnpm build

      - uses: actions/download-artifact@v4
        with:
          pattern: native-tools-*
          path: native-tool-artifacts

      - name: Assemble the per-platform mcp-client packages
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          rm -rf npm/artifacts && mkdir -p npm/artifacts
          for artifact in native-tool-artifacts/native-tools-*; do
            # Each artifact holds a <rust-target>/mcp-client tree (see the upload above).
            cp -R "$artifact"/. npm/artifacts/
          done
          find npm/artifacts -maxdepth 2 -type f -print
          node npm/build-mcp-client-packages.mjs "$version" npm/artifacts

      - run: pnpm pack:check

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="latest"
          if [[ "$version" == *-* ]]; then
            tag="beta"
          fi

          # Platform packages first, so the optionalDependencies the root
          # manifest names already resolve when it is published.
          for d in npm/dist/mcp-client-*; do
            platform_name="$(node -p "require('./$d/package.json').name")"
            if npm view "$platform_name@$version" version >/dev/null 2>&1; then
              echo "$platform_name@$version is already published"
            else
              npm publish "$d" --access public --tag "$tag"
            fi
          done

          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "$package_name@$version is already published"
          else
            pnpm publish --access public --tag "$tag" --no-git-checks
          fi
          npm dist-tag add "$package_name@$version" "$tag"
          if [[ "$tag" != "latest" ]]; then
            npm dist-tag rm "$package_name" latest || true
          fi

  publish-crate:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.crate_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'checker'))) }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
    concurrency:
      group: crates-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test -p introspection-recipe-check

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo pkgid -p introspection-recipe-check | sed 's/.*[@#]//')"
          if [[ "$version" == "0.0.0" ]]; then
            echo "introspection-recipe-check has not been prepared by its 0.1.0 release PR"
            exit 1
          fi
          if curl -sfo /dev/null -A "recipes-release (github.com/introspection-org/recipes)" \
            "https://crates.io/api/v1/crates/introspection-recipe-check/${version}"; then
            echo "introspection-recipe-check@${version} is already published"
          else
            cargo publish -p introspection-recipe-check
          fi

  build-python-wheels:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.python_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'checker'))) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-14
            target: aarch64-apple-darwin
            manylinux: auto
          - os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: auto
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: auto
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.11.5
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi --out dist --manifest-path bindings/python/Cargo.toml

      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  publish-python:
    needs:
      - release-please
      - build-python-wheels
      - publish-crate
    if: ${{ always() && needs.build-python-wheels.result == 'success' && needs.publish-crate.result == 'success' && (needs.release-please.outputs.python_release_created == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.train == 'all' || inputs.train == 'checker'))) }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"

      - run: uvx --from maturin==1.11.5 maturin sdist --out dist --manifest-path bindings/python/Cargo.toml

      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: true
