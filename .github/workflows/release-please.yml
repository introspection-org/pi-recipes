name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.release.outputs.releases_created }}
      crate_release_created: ${{ steps.release.outputs['crates/pi-recipe-check--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-recipe-check:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-14
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release -p pi-recipe-check

      - run: node scripts/package-recipe-check.mjs
        env:
          RECIPE_CHECK_PLATFORM: ${{ matrix.platform }}
          RECIPE_CHECK_ARCH: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: recipe-check-${{ matrix.platform }}-${{ matrix.arch }}
          path: vendor/recipe-check/${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    needs:
      - release-please
      - build-recipe-check
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck && pnpm test && pnpm build

      - uses: actions/download-artifact@v4
        with:
          pattern: recipe-check-*
          path: recipe-check-artifacts

      - name: Prepare packaged recipe-check binaries
        shell: bash
        run: |
          set -euo pipefail
          rm -rf vendor/recipe-check
          mkdir -p vendor/recipe-check
          for artifact in recipe-check-artifacts/recipe-check-*; do
            platform_id="${artifact##*/recipe-check-}"
            mkdir -p "vendor/recipe-check/${platform_id}"
            find "$artifact" -type f -name 'recipe-check*' -exec cp {} "vendor/recipe-check/${platform_id}/" \;
          done
          find vendor/recipe-check -type f ! -name '*.exe' -exec chmod 755 {} \;
          find vendor/recipe-check -maxdepth 3 -type f -print

      - run: pnpm pack:check

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          tag="latest"
          if [[ "$version" == *-* ]]; then
            tag="beta"
          fi
          if npm view "$package_name@$version" version >/dev/null 2>&1; then
            echo "$package_name@$version is already published"
          else
            npm publish --access public --tag "$tag"
          fi
          npm dist-tag add "$package_name@$version" "$tag"
          if [[ "$tag" != "latest" ]]; then
            npm dist-tag rm "$package_name" latest || true
          fi
          npm access set status=public "$package_name"

  publish-crate:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.crate_release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
    concurrency:
      group: crates-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test -p pi-recipe-check

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo pkgid -p pi-recipe-check | sed 's/.*[@#]//')"
          if curl -sfo /dev/null -A "pi-recipes-release (github.com/introspection-org/pi-recipes)" \
            "https://crates.io/api/v1/crates/pi-recipe-check/${version}"; then
            echo "pi-recipe-check@${version} is already published"
          else
            cargo publish -p pi-recipe-check
          fi
