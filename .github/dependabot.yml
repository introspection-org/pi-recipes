version: 2

# Three ecosystems in one repo, each with its own manifest root:
#
#   npm    -> / (the published @introspection-ai/recipes package; pnpm)
#   cargo  -> / (cargo workspace: crates/* + bindings/python)
#   uv     -> /bindings/python (maturin build + dev toolchain, own uv.lock)
#
# Grouping convention matches the SDK repos: fleets that move in lockstep land
# in one PR, everything else comes individually, and security alerts roll up
# per ecosystem so a batch of advisories is one review rather than one each.

updates:
  # ── npm: the published package + its Pi peer/dev toolchain ──
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # The Pi packages are peer + dev dependencies, not runtime `dependencies`,
    # and they are exactly the ones that need to stay current — so watch all
    # dependency types rather than production only.
    allow:
      - dependency-type: "all"
    groups:
      # Pi runtime and the first-party SDK the recipe format is built on.
      # No update-type filter: majors matter here and should surface promptly.
      introspection-and-pi:
        applies-to: version-updates
        patterns:
          - "@introspection-sdk/*"
          - "@introspection-ai/*"
          - "@earendil-works/*"

      typescript-tooling:
        applies-to: version-updates
        patterns:
          - "typescript"
          - "esbuild"
          - "vitest"
          - "typebox"
          - "@types/node"

      security-rollup:
        applies-to: security-updates
        patterns:
          - "*"

  # ── Rust: the workspace behind recipe-check and the MCP client ──
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Roll routine minor/patch bumps into one PR to cut noise; majors (which
      # are breaking for pre-1.0 crates, and for pyo3 mean an ABI review) come
      # as individual PRs so they can be reviewed and tested on their own.
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      security-rollup:
        applies-to: security-updates
        patterns:
          - "*"

  # ── Python: the maturin binding's own uv.lock (dev toolchain only) ──
  #
  # The dev group pins maturin/mypy/ruff exactly, and ci.yml pins the matching
  # uv release via `astral-sh/setup-uv` + `[tool.uv] required-version`. Bumping
  # uv itself stays manual — those two must move together.
  - package-ecosystem: "uv"
    directory: "/bindings/python"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      python-tooling:
        applies-to: version-updates
        patterns:
          - "maturin"
          - "mypy"
          - "pytest*"
          - "ruff"
      security-rollup:
        applies-to: security-updates
        patterns:
          - "*"

  # ── GitHub Actions used by ci.yml / release-please.yml ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      security-rollup:
        applies-to: security-updates
        patterns:
          - "*"
